---
# yamllint disable rule:line-length
name: Standalone Docker Build & Compression Check

permissions:
  contents: read

# Check the actual Alpine/Python/native dependency combination before merging a bump.
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - docker-build
  pull_request:
    paths:
      - Dockerfile
      - homeway/requirements.txt
      - homeway/homeway/compression.py
      - homeway/homeway/zstandarddictionary.py
      - tests/test_compression_compatibility.py
      - .github/workflows/standalone-docker-build-test.yml

jobs:
  build:
    name: Test Standalone Docker (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/386, linux/arm/v6, linux/arm/v7, linux/arm64]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A local build needs no registry credentials, including on Dependabot PRs.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          file: ./Dockerfile
          push: false
          load: true
          tags: homeway:test

      - name: Verify native compression and protocol compatibility
        run: |
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint /root/homeway-env/bin/python homeway:test -c "import sys, zstandard; print(sys.version); print(zstandard.__version__, zstandard.ZSTD_VERSION)"
          docker run --rm --platform "${{ matrix.platform }}" --env PYTHONPATH=/root/homeway/homeway --entrypoint /root/homeway-env/bin/python homeway:test -m unittest discover -s tests -p test_compression_compatibility.py -v
