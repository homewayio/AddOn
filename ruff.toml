# This config controls the ruff linter.

# Exclude the proto folder for Ruff since we can't control it.
extend-exclude = ["homeway/homeway/Proto"]

[lint]
# Keep the pre-0.16 default rules explicit so Ruff upgrades don't silently expand the lint scope.
select = ["E4", "E7", "E9", "F", "B", "RUF021"]